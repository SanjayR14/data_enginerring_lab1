
services:
  # Airflow Database Service (Metadata)
  postgres:
    image: postgres:15-alpine
    container_name: cloud_cost_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloud_cost_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Apache ZooKeeper Service
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: cloud_cost_zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # Apache Kafka Broker Service
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: cloud_cost_kafka
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # FastAPI Backend Service
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cloud_cost_backend
    restart: always
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-cloud_cost_db}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_TOPIC=cloud-cost-events
      - KAFKA_GROUP_ID=cloud-cost-consumer
      - KAFKA_DLQ_TOPIC=cloud-cost-events-dlq
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - UPLOAD_DIRECTORY=/app/data/uploads
      - AIRFLOW_URL=http://airflow-webserver:8080
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  # React Frontend Service
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: cloud_cost_frontend
    restart: always
    ports:
      - "3001:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
      - BACKEND_HOST=backend
    depends_on:
      - backend

  # Apache Airflow Database Initializer
  airflow-init:
    image: apache/airflow:2.8.1-python3.10
    container_name: cloud_cost_airflow_init
    environment:
      - _PIP_ADDITIONAL_REQUIREMENTS=databricks-sql-connector pandas
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-cloud_cost_db}
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - _AIRFLOW_DB_UPGRADE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=${AIRFLOW_USERNAME:-airflow}
      - _AIRFLOW_WWW_USER_PASSWORD=${AIRFLOW_PASSWORD:-airflow}
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db init && \
        airflow users create --username ${AIRFLOW_USERNAME:-airflow} --password ${AIRFLOW_PASSWORD:-airflow} --firstname Airflow --lastname Admin --role Admin --email admin@example.com
    depends_on:
      postgres:
        condition: service_healthy

  # Apache Airflow Webserver UI (http://localhost:8085)
  airflow-webserver:
    image: apache/airflow:2.8.1-python3.10
    container_name: cloud_cost_airflow_webserver
    restart: always
    ports:
      - "8085:8080"
    env_file:
      - .env
    environment:
      - _PIP_ADDITIONAL_REQUIREMENTS=databricks-sql-connector pandas
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-cloud_cost_db}
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - PYTHONPATH=/opt/airflow
      - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
      - AIRFLOW__WEBSERVER__SECRET_KEY=a_very_secret_key_12345
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./backend:/opt/airflow/backend
    command: webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # Apache Airflow Scheduler
  airflow-scheduler:
    image: apache/airflow:2.8.1-python3.10
    container_name: cloud_cost_airflow_scheduler
    restart: always
    env_file:
      - .env
    environment:
      - _PIP_ADDITIONAL_REQUIREMENTS=databricks-sql-connector pandas
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-cloud_cost_db}
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - PYTHONPATH=/opt/airflow
      - AIRFLOW__WEBSERVER__SECRET_KEY=a_very_secret_key_12345
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./backend:/opt/airflow/backend
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully


volumes:
  postgres_data:
